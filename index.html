/* Askı v0.1 — one-hand phone app. A narrow column (max 480px) of cards on warm off-white,
   ink type, a single yellow accent for the next action. Deliberately light-only (the owner asked for light colors). */
:root {
  --bg: #F7F6F3;
  --surface: #FFFFFF;
  --surface-2: #F3F2EE;
  --line: #E7E5E0;
  --line-2: #F0EEE9;
  --ink: #15171B;
  --ink-2: #3B3F46;
  --muted: #5A5F68;
  --faint: #8A8D93;
  --accent: #FFD43A;
  --accent-soft: #FFF1B8;
  --accent-ink: #4A4536;
  --accent-deep: #8A6A00;
  --top: #FFD43A;
  --bottom: #3D7BFF;
  --danger: #B3261E;
  --scrim: rgba(40, 36, 28, 0.32);
  --photo: #ECEBE9;
  --font-display: 'Archivo', 'Helvetica Neue', Helvetica, Arial, sans-serif;
  --font-body: 'Archivo', 'Helvetica Neue', Helvetica, Arial, sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
  --r-l: 28px;
  --r-m: 20px;
  --r-s: 14px;
  --tabbar-h: 72px;
  color-scheme: light;
}

html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.4;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior-y: none;
}
* { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
button { border: 0; background: none; padding: 0; margin: 0; cursor: pointer; }
button:disabled { cursor: default; opacity: 0.45; }
a { color: inherit; }
:focus-visible { outline: 2.5px solid var(--ink); outline-offset: 2px; border-radius: 12px; }
img { display: block; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

#app {
  position: relative;
  max-width: 480px;
  min-height: 100%;
  margin: 0 auto;
  background: var(--bg);
}
@media (min-width: 560px) {
  body { background: #ECEAE5; }
  #app { box-shadow: 0 0 0 1px var(--line), 0 30px 80px rgba(40, 36, 28, 0.10); }
}

.screen {
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 14px calc(var(--tabbar-h) + 32px + env(safe-area-inset-bottom, 0px));
  min-height: 100vh;
  min-height: 100svh;
}

/* ---------- type ---------- */
.display { font-family: var(--font-display); font-weight: 800; font-stretch: 125%; letter-spacing: -0.02em; line-height: 1.04; text-wrap: balance; margin: 0; }
.h1 { font-size: 30px; }
.h2 { font-size: 22px; }
.h3 { font-size: 17px; font-weight: 700; font-stretch: 100%; letter-spacing: 0; }
.mono { font-family: var(--font-mono); font-size: 10.5px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; }
.mono.muted, .muted { color: var(--muted); }
.small { font-size: 13px; }
.tiny { font-size: 12px; }
p { margin: 0; }
.lead { font-size: 14.5px; color: var(--muted); line-height: 1.45; }

/* ---------- top bar ---------- */
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 48px; }
.logo { display: flex; align-items: center; gap: 8px; font-family: var(--font-display); font-weight: 800; font-stretch: 125%; font-size: 26px; letter-spacing: -0.02em; line-height: 1; }
.logo svg { display: block; }
.row { display: flex; align-items: center; gap: 8px; }
.row.between { justify-content: space-between; }
.row.wrap { flex-wrap: wrap; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.grow { flex: 1; min-width: 0; }

/* ---------- buttons ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 50px; padding: 0 18px; border-radius: 25px; font-size: 15px; font-weight: 700; white-space: nowrap; transition: transform 0.12s ease, background 0.15s ease; user-select: none; }
.btn:active:not(:disabled) { transform: scale(0.98); }
.btn svg { flex: none; }
.btn-primary { background: var(--accent); color: var(--ink); box-shadow: 0 8px 18px rgba(196, 150, 0, 0.22); }
.btn-secondary { background: var(--surface); color: var(--ink); border: 1.5px solid var(--line); }
.btn-outline { background: var(--surface); color: var(--ink); border: 1.5px solid var(--ink); }
.btn-soft { background: var(--accent-soft); color: var(--ink); }
.btn-ghost { background: transparent; color: var(--ink); }
.btn-danger { background: var(--surface); color: var(--danger); border: 1.5px solid #F0D2CF; }
.btn-block { width: 100%; }
.btn-sm { height: 40px; padding: 0 14px; font-size: 13.5px; border-radius: 20px; }
.btn-xs { height: 34px; padding: 0 12px; font-size: 12.5px; border-radius: 17px; }
.icon-btn { flex: none; display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 22px; background: var(--surface); border: 1px solid var(--line); position: relative; }
.icon-btn.soft { background: var(--accent-soft); border-color: transparent; }
.icon-btn.plain { background: transparent; border-color: transparent; }
.badge { position: absolute; right: -4px; top: -4px; min-width: 19px; height: 19px; padding: 0 5px; border-radius: 10px; background: var(--accent); border: 2px solid var(--bg); display: flex; align-items: center; justify-content: center; font-family: var(--font-mono); font-size: 9.5px; font-weight: 600; }
.avatar { flex: none; width: 44px; height: 44px; border-radius: 22px; overflow: hidden; background: #E4E1DB; border: 1px solid var(--line); display: inline-flex; align-items: center; justify-content: center; font-weight: 800; }
.avatar img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 12%; }

/* ---------- chips & segments ---------- */
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin-inline: -16px; padding-inline: 16px; }
.chips::-webkit-scrollbar { display: none; }
.chips.wrap { flex-wrap: wrap; overflow: visible; margin-inline: 0; padding-inline: 0; }
.chip { flex: none; display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 15px; border-radius: 20px; background: var(--surface); border: 1px solid var(--line); font-size: 14px; font-weight: 600; white-space: nowrap; }
.chip.sm { height: 34px; padding: 0 12px; font-size: 13px; }
.chip.on { background: var(--accent); border-color: var(--accent); }
.chip .count { font-family: var(--font-mono); font-size: 11px; color: var(--muted); }
.chip.on .count { color: var(--ink); }
.swatch { display: inline-block; width: 14px; height: 14px; border-radius: 7px; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.12); flex: none; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; padding: 4px; border-radius: 24px; background: var(--surface); border: 1px solid var(--line); }
.seg button { height: 40px; border-radius: 20px; font-size: 14px; font-weight: 600; }
.seg button.on { background: var(--accent); font-weight: 700; }

/* ---------- cards ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-m); }
.card.pad { padding: 14px; }
.card.soft { background: var(--accent-soft); border-color: transparent; }
.section-label { display: flex; align-items: center; justify-content: space-between; margin: 22px 0 10px; }
.note { display: flex; gap: 10px; align-items: flex-start; font-size: 13px; line-height: 1.45; color: var(--muted); }
.note svg { flex: none; margin-top: 1px; }
.divider { height: 1px; background: var(--line-2); margin: 0; border: 0; }

/* ---------- kabin ---------- */
.kabin-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-top: 14px; }
.kabin-head .h1 { font-size: 26px; }
.stage { position: relative; margin-top: 12px; height: clamp(320px, calc(100svh - 430px), 600px); border-radius: var(--r-l); overflow: hidden; background: var(--photo); display: flex; align-items: center; justify-content: center; }
.stage.trial-on { height: clamp(300px, calc(100svh - 540px), 520px); }
.stage canvas, .stage .stage-img { height: 100%; width: auto; max-width: 100%; object-fit: contain; display: block; }
.stage-top { position: absolute; left: 12px; right: 12px; top: 12px; display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; pointer-events: none; }
.stage-top > * { pointer-events: auto; }
.stage .seg { box-shadow: 0 6px 16px rgba(40, 36, 28, 0.10); padding: 3px; }
.stage .seg button { height: 38px; padding: 0 12px; font-size: 13.5px; }
.angle-tabs { display: flex; flex-direction: column; gap: 6px; }
.angle-tabs button { min-width: 52px; height: 34px; padding: 0 10px; border-radius: 17px; background: rgba(255, 255, 255, 0.94); font-family: var(--font-mono); font-size: 10px; font-weight: 600; letter-spacing: 0.06em; box-shadow: 0 2px 8px rgba(40, 36, 28, 0.10); }
.angle-tabs button.on { background: var(--accent); }
.stage-bottom { position: absolute; left: 12px; right: 12px; bottom: 12px; display: flex; align-items: flex-end; justify-content: space-between; gap: 8px; pointer-events: none; }
.stage-bottom > * { pointer-events: auto; }
.pill { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 11px; border-radius: 15px; background: rgba(255, 255, 255, 0.94); font-family: var(--font-mono); font-size: 10px; font-weight: 600; letter-spacing: 0.06em; box-shadow: 0 2px 8px rgba(40, 36, 28, 0.10); white-space: nowrap; }
.pill.trial { background: var(--accent-soft); border: 1.5px dashed var(--ink); box-shadow: none; }
.pill.yellow { background: var(--accent); }
.stage-empty { text-align: center; padding: 24px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
.board { position: absolute; inset: 0; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1.15fr 1fr; gap: 10px; padding: 16px 16px 64px; }
.board .slot-img { position: relative; border-radius: 18px; background: rgba(255, 255, 255, 0.72); display: flex; align-items: center; justify-content: center; overflow: hidden; }
.board .slot-img img { width: 100%; height: 100%; object-fit: contain; padding: 8px; }
.board .slot-img.cover img { object-fit: cover; padding: 0; }
.board .slot-img .mono { position: absolute; left: 10px; top: 8px; color: var(--muted); }
.board .slot-img.empty { border: 1.5px dashed #CFCBC3; background: transparent; }
.trial-bar { margin-top: 10px; padding: 12px 14px; border-radius: var(--r-m); background: var(--accent-soft); display: flex; flex-direction: column; gap: 10px; }
.trial-bar .acts { display: grid; grid-template-columns: auto 1fr 1fr; gap: 8px; }
.tray { margin-top: 12px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
.slot { display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 0; }
.slot .tile { position: relative; width: 100%; aspect-ratio: 1; max-width: 66px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; overflow: hidden; }
.slot .tile img { width: 100%; height: 100%; object-fit: contain; padding: 6px; }
.slot .tile.cover img { object-fit: cover; padding: 0; }
.slot .tile.empty { border: 1.5px dashed #BDB9B1; background: transparent; }
.slot .tile.trial { border: 1.5px dashed var(--ink); background: var(--accent-soft); }
.slot .mono { font-size: 9.5px; color: var(--muted); }
.slot.filled .mono { color: var(--ink); }
.kabin-actions { margin-top: 14px; display: grid; grid-template-columns: 1fr 1.2fr 1fr; gap: 8px; }
.kabin-actions .btn { padding: 0 10px; font-size: 14px; }

/* ---------- item grids ---------- */
.items-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.item-card { position: relative; display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-m); overflow: hidden; text-align: left; }
.item-card .ph { position: relative; aspect-ratio: 1; background: var(--surface-2); display: flex; align-items: center; justify-content: center; }
.item-card .ph img { width: 100%; height: 100%; object-fit: contain; padding: 12px; }
.item-card .ph.cover img { object-fit: cover; padding: 0; }
.item-card .meta { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 3px; }
.item-card .name { font-size: 14px; font-weight: 700; line-height: 1.2; }
.item-card .sub { font-family: var(--font-mono); font-size: 9.5px; letter-spacing: 0.06em; color: var(--muted); text-transform: uppercase; }
.tag { position: absolute; left: 10px; top: 10px; height: 20px; padding: 0 7px; border-radius: 10px; background: var(--surface); display: inline-flex; align-items: center; font-family: var(--font-mono); font-size: 8.5px; font-weight: 600; letter-spacing: 0.05em; }
.tag.yellow { background: var(--accent); }
.tag.trial { background: var(--accent-soft); border: 1px dashed var(--ink); }
.tag.right { left: auto; right: 10px; }
.empty { text-align: center; padding: 40px 18px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
.empty .art { width: 84px; height: 84px; border-radius: 42px; background: var(--accent-soft); display: flex; align-items: center; justify-content: center; }

/* ---------- outfit cards ---------- */
.outfit-card { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-m); overflow: hidden; text-align: left; }
.outfit-card .ph { aspect-ratio: 3 / 4; background: var(--photo); position: relative; }
.outfit-card .ph img { width: 100%; height: 100%; object-fit: cover; }
.outfit-card .meta { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 6px; }
.minis { display: flex; gap: 4px; }
.minis img, .minis span { width: 26px; height: 26px; border-radius: 7px; background: var(--surface-2); object-fit: contain; padding: 2px; }
.minis img.cover { object-fit: cover; padding: 0; }

/* ---------- tab bar ---------- */
.tabbar { position: fixed; z-index: 30; left: 50%; transform: translateX(-50%); bottom: calc(10px + env(safe-area-inset-bottom, 0px)); width: calc(100% - 24px); max-width: 456px; height: var(--tabbar-h); padding: 0 8px; display: flex; align-items: center; justify-content: space-between; background: var(--surface); border: 1px solid var(--line); border-radius: 36px; box-shadow: 0 12px 32px rgba(40, 36, 28, 0.13); }
.tab { width: 64px; height: 54px; border-radius: 27px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: #6E7178; font-size: 11px; font-weight: 600; }
.tab.on { background: var(--accent-soft); color: var(--ink); font-weight: 700; }
.tab-plus { width: 54px; height: 54px; border-radius: 27px; background: var(--accent); display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 14px rgba(196, 150, 0, 0.30); }

/* ---------- sheets & overlays ---------- */
.scrim { position: fixed; inset: 0; z-index: 60; background: var(--scrim); animation: fadeIn 0.18s ease; }
.sheet { position: fixed; z-index: 61; left: 50%; transform: translateX(-50%); bottom: 0; width: 100%; max-width: 480px; max-height: 88vh; max-height: 88svh; overflow-y: auto; background: var(--bg); border-radius: 28px 28px 0 0; padding: 10px max(16px, env(safe-area-inset-left, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-right, 0px)); animation: sheetIn 0.22s cubic-bezier(0.2, 0.8, 0.2, 1); }
.sheet .handle { width: 36px; height: 5px; border-radius: 3px; background: #DDDAD4; margin: 0 auto 12px; }
.overlay { position: fixed; z-index: 50; inset: 0; overflow-y: auto; background: var(--bg); animation: fadeIn 0.15s ease; }
.overlay-inner { max-width: 480px; margin: 0 auto; min-height: 100%; padding: calc(12px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(28px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.ov-head { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 12px; min-height: 56px; margin: calc(-12px - env(safe-area-inset-top, 0px)) -16px 6px; padding: calc(6px + env(safe-area-inset-top, 0px)) 16px 6px; background: var(--bg); }
.ov-head .title { flex: 1; min-width: 0; font-size: 17px; font-weight: 700; text-align: center; }
.ov-foot { position: sticky; bottom: 0; z-index: 2; margin: 16px -16px calc(-28px - env(safe-area-inset-bottom, 0px)); padding: 12px 16px calc(14px + env(safe-area-inset-bottom, 0px)); background: linear-gradient(180deg, rgba(247, 246, 243, 0) 0%, var(--bg) 22%); display: flex; flex-direction: column; gap: 8px; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes sheetIn { from { transform: translate(-50%, 40px); opacity: 0.6; } to { transform: translate(-50%, 0); opacity: 1; } }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

/* ---------- forms ---------- */
.field { display: flex; flex-direction: column; gap: 6px; }
.field > .mono { color: var(--muted); }
.input { height: 48px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); padding: 0 14px; font-size: 15px; width: 100%; outline: none; }
.input:focus { border-color: var(--ink); }
textarea.input { height: auto; min-height: 84px; padding: 12px 14px; resize: vertical; line-height: 1.4; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.form { display: flex; flex-direction: column; gap: 16px; margin-top: 16px; }
.picker-zone { border-radius: var(--r-l); border: 1.5px dashed #CFCBC3; padding: 26px 18px; display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; background: var(--surface); }
.file-btn { position: relative; overflow: hidden; }
.file-btn input[type=file] { position: absolute; inset: 0; opacity: 0; font-size: 0; cursor: pointer; }
.range { width: 100%; accent-color: #E2B800; }
.stars { display: flex; gap: 6px; }
.stars button { width: 44px; height: 44px; border-radius: 22px; background: var(--surface); border: 1px solid var(--line); font-size: 15px; font-weight: 700; }
.stars button.on { background: var(--accent); border-color: var(--accent); }

/* ---------- box editor ---------- */
.boxed { position: relative; border-radius: var(--r-m); overflow: hidden; background: var(--photo); touch-action: none; user-select: none; -webkit-user-select: none; }
.boxed img { width: 100%; height: auto; pointer-events: none; }
.boxed .box { position: absolute; border: 2.5px solid var(--accent); border-radius: 10px; box-shadow: 0 0 0 1.5px var(--ink), inset 0 0 0 1px rgba(21, 23, 27, 0.35); background: rgba(255, 212, 58, 0.10); }
.boxed .box.sel { background: rgba(255, 212, 58, 0.18); }
.boxed .box .lbl { position: absolute; left: -2px; top: -26px; height: 22px; padding: 0 8px; border-radius: 11px; background: var(--accent); font-family: var(--font-mono); font-size: 9.5px; font-weight: 600; letter-spacing: 0.05em; display: flex; align-items: center; white-space: nowrap; box-shadow: 0 0 0 1.5px var(--ink); }
.boxed .box .lbl.below { top: auto; bottom: -26px; }
.boxed .box .rm { position: absolute; right: -14px; top: -14px; width: 28px; height: 28px; border-radius: 14px; background: var(--surface); box-shadow: 0 0 0 1.5px var(--ink); display: flex; align-items: center; justify-content: center; }
.boxed .box .rs { position: absolute; right: -12px; bottom: -12px; width: 26px; height: 26px; border-radius: 13px; background: var(--accent); box-shadow: 0 0 0 1.5px var(--ink); }
.box-list { display: flex; flex-direction: column; gap: 10px; }
.box-row { display: grid; grid-template-columns: 64px 1fr auto; gap: 12px; align-items: center; padding: 10px; border-radius: var(--r-m); background: var(--surface); border: 1px solid var(--line); }
.box-row .thumb { width: 64px; height: 64px; border-radius: 12px; background: var(--surface-2); object-fit: cover; }
.check { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; }
.check span { width: 26px; height: 26px; border-radius: 8px; border: 2px solid #BDB9B1; display: flex; align-items: center; justify-content: center; background: var(--surface); }
.check.on span { background: var(--accent); border-color: var(--ink); }

/* ---------- calibrate ---------- */
.cal-stage { position: relative; margin-top: 8px; border-radius: var(--r-l); overflow: hidden; background: var(--photo); touch-action: none; display: flex; justify-content: center; }
.cal-stage canvas { display: block; width: 100%; height: auto; max-height: 58svh; object-fit: contain; }
.waist { position: absolute; left: 0; right: 0; height: 0; border-top: 2px dashed var(--ink); pointer-events: none; }
.waist .handle-btn { pointer-events: auto; position: absolute; right: 8px; top: -17px; height: 34px; padding: 0 10px; border-radius: 17px; background: var(--surface); box-shadow: 0 0 0 1.5px var(--ink); display: flex; align-items: center; gap: 4px; font-family: var(--font-mono); font-size: 10px; font-weight: 600; letter-spacing: 0.06em; touch-action: none; }
.legend { display: flex; gap: 12px; align-items: center; }
.legend span { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; }
.legend i { width: 12px; height: 12px; border-radius: 4px; display: inline-block; }

/* ---------- suggestions ---------- */
.sug { display: grid; grid-template-columns: 112px 1fr; gap: 14px; padding: 12px; border-radius: var(--r-m); background: var(--surface); border: 1px solid var(--line); animation: rise 0.25s ease both; }
.sug .ph { width: 112px; aspect-ratio: 3 / 4; border-radius: 14px; overflow: hidden; background: var(--photo); }
.sug .ph img { width: 100%; height: 100%; object-fit: cover; }
.sug .body { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.sug .acts { margin-top: auto; display: flex; gap: 6px; flex-wrap: wrap; }

/* ---------- list rows ---------- */
.list { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-m); overflow: hidden; }
.list .li { display: flex; align-items: center; gap: 12px; min-height: 58px; padding: 10px 14px; border-top: 1px solid var(--line-2); text-align: left; width: 100%; }
.list .li:first-child { border-top: 0; }
.list .li .ic { flex: none; width: 36px; height: 36px; border-radius: 12px; background: var(--surface-2); display: flex; align-items: center; justify-content: center; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.stat { padding: 12px; border-radius: var(--r-s); background: var(--surface); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 2px; }
.stat b { font-size: 20px; font-variant-numeric: tabular-nums; }
.angles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.angle-tile { position: relative; aspect-ratio: 3 / 4; border-radius: 16px; overflow: hidden; background: var(--surface-2); border: 1.5px dashed #CFCBC3; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 6px; }
.angle-tile.has { border: 1px solid var(--line); }
.angle-tile img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.angle-tile .mono { position: relative; z-index: 1; background: rgba(255, 255, 255, 0.92); padding: 3px 7px; border-radius: 8px; }
.angle-tile.has .mono { position: absolute; left: 6px; bottom: 6px; }

/* ---------- misc ---------- */
.toast { position: fixed; z-index: 80; left: 50%; bottom: calc(var(--tabbar-h) + 26px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); max-width: calc(100% - 40px); padding: 11px 16px; border-radius: 22px; background: var(--ink); color: #FFFFFF; font-size: 13.5px; font-weight: 600; box-shadow: 0 10px 24px rgba(21, 23, 27, 0.25); animation: rise 0.2s ease; text-align: center; }
.spinner { width: 18px; height: 18px; border-radius: 50%; border: 2.5px solid rgba(21, 23, 27, 0.18); border-top-color: var(--ink); animation: spin 0.8s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }
.ai-row { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: var(--r-s); background: var(--accent-soft); font-size: 13px; color: var(--accent-ink); }
.dialog { position: fixed; z-index: 90; left: 50%; top: 50%; transform: translate(-50%, -50%); width: calc(100% - 48px); max-width: 360px; padding: 20px; border-radius: 24px; background: var(--surface); box-shadow: 0 24px 60px rgba(21, 23, 27, 0.25); display: flex; flex-direction: column; gap: 14px; animation: fadeIn 0.15s ease; }
.dialog .acts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.kv { display: flex; justify-content: space-between; gap: 12px; padding: 11px 0; border-top: 1px solid var(--line-2); font-size: 14px; }
.kv:first-child { border-top: 0; }
.kv span:first-child { color: var(--muted); }
.big-photo { border-radius: var(--r-l); overflow: hidden; background: var(--surface-2); aspect-ratio: 1; display: flex; align-items: center; justify-content: center; }
.big-photo img { width: 100%; height: 100%; object-fit: contain; padding: 18px; }
.big-photo.cover img { object-fit: cover; padding: 0; }
.onb-hero { margin-top: 24px; border-radius: var(--r-l); background: var(--accent-soft); padding: 22px; position: relative; overflow: hidden; }
.tip { display: grid; grid-template-columns: 32px 1fr; gap: 10px; align-items: start; font-size: 14px; }
.tip .n { width: 32px; height: 32px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; font-family: var(--font-mono); font-size: 12px; font-weight: 600; }
.tip strong { font-weight: 700; }
.code { font-family: var(--font-mono); font-size: 13px; letter-spacing: 0.08em; }
.hidden { display: none !important; }

.dscrim { position: fixed; inset: 0; z-index: 89; background: var(--scrim); animation: fadeIn 0.15s ease; }

</style>

const LIN = new Float32Array(256);

/* ---------------- storage (IndexedDB with in-memory fallback) ---------------- */
const STORES = ['items', 'outfits', 'blobs', 'meta'];
let idb = null; let mem = null;
function openDB() {
  return new Promise((res) => {
    let done = false; const finish = (v) => { if (!done) { done = true; res(v); } };
    try {
      const rq = indexedDB.open('aski', 1);
      rq.onupgradeneeded = () => { const d = rq.result; STORES.forEach((n) => { if (!d.objectStoreNames.contains(n)) d.createObjectStore(n, { keyPath: n === 'meta' ? 'key' : 'id' }); }); };
      rq.onsuccess = () => finish(rq.result);
      rq.onerror = () => finish(null);
      rq.onblocked = () => finish(null);
      setTimeout(() => finish(null), 4000);
    } catch (e) { finish(null); }
  });
}
function req(store, mode, fn) {
  return new Promise((res) => {
    try {
      const t = idb.transaction(store, mode); const os = t.objectStore(store); const r = fn(os);
      t.oncomplete = () => res(r && 'result' in r ? r.result : true);
      t.onerror = () => res(null); t.onabort = () => res(null);

A.Store = {
  persistent: false,
  async init() {
    idb = await openDB();
    this.persistent = !!idb;
    if (!idb) mem = Object.fromEntries(STORES.map((n) => [n, new Map()]));
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { /* optional */ }
  },
  async all(store) { if (!idb) return [...mem[store].values()]; return (await req(store, 'readonly', (os) => os.getAll())) || []; },
  async get(store, key) { if (!idb) return mem[store].get(key) || null; return (await req(store, 'readonly', (os) => os.get(key))) || null; },
  async put(store, val) { if (!idb) { mem[store].set(store === 'meta' ? val.key : val.id, val); return true; } return req(store, 'readwrite', (os) => os.put(val)); },
  async del(store, key) { if (!idb) { mem[store].delete(key); return true; } return req(store, 'readwrite', (os) => os.delete(key)); },
  async clear(store) { if (!idb) { mem[store].clear(); return true; } return req(store, 'readwrite', (os) => os.clear()); },

/* dominant garment color of an image/canvas, ignoring the background ring */
A.dominantColor = (src) => {
  const iw = src.naturalWidth || src.width, ih = src.naturalHeight || src.height;
  const s = Math.min(1, 72 / Math.max(iw, ih));
  const w = Math.max(8, Math.round(iw * s)), h = Math.max(8, Math.round(ih * s));
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d', { willReadFrequently: true }); g.drawImage(src, 0, 0, w, h);
  const d = g.getImageData(0, 0, w, h).data;
  const ring = Math.max(1, Math.round(Math.min(w, h) * 0.08));
  let br = 0, bg = 0, bb = 0, bn = 0; const pts = [];
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const p = (y * w + x) * 4; if (d[p + 3] < 128) continue;
    const edge = x < ring || y < ring || x >= w - ring || y >= h - ring;
    if (edge) { br += d[p]; bg += d[p + 1]; bb += d[p + 2]; bn++; }
    const inner = x > w * 0.18 && x < w * 0.82 && y > h * 0.15 && y < h * 0.85;
    if (inner) pts.push(rgb2lab(d[p], d[p + 1], d[p + 2]));
  }

  const k = Math.min(3, pts.length);
  let cent = [pts[0], pts[Math.floor(pts.length / 2)], pts[pts.length - 1]].slice(0, k).map((p) => p.slice());
  let cnt = new Array(k).fill(0);
  for (let it = 0; it < 9; it++) {
    const sum = cent.map(() => [0, 0, 0]); cnt = new Array(k).fill(0);
    for (const p of pts) { let bi = 0, bd = 1e9; for (let j = 0; j < k; j++) { const dd = dE(p, cent[j]); if (dd < bd) { bd = dd; bi = j; } } sum[bi][0] += p[0]; sum[bi][1] += p[1]; sum[bi][2] += p[2]; cnt[bi]++; }

  }

/* ---------------- garment segmentation on the person's photo ---------------- */
const Seg = A.Seg = {
  bgFactor: 0.4,
  prepare(imgData) {

      const i = y * w + x;

      const gy = (L[i + w - 1] + 2 * L[i + w] + L[i + w + 1]) - (L[i - w - 1] + 2 * L[i - w] + L[i - w + 1]);
      grad[i] = (Math.abs(gx) + Math.abs(gy)) / 8;

    for (let y = 0; y < h; y += 3) for (let x = 0; x < w; x += 3) if (x < bw || x >= w - bw || y < bh) idx.push(y * w + x);
    const K = 6; let cent = []; const byL = idx.slice().sort((p, q) => L[p] - L[q]);
    for (let k = 0; k < K; k++) { const i = byL[Math.min(byL.length - 1, Math.floor(((k + 0.5) / K) * byL.length))]; cent.push([L[i], a[i], b[i]]); }
    for (let it = 0; it < 8; it++) {
      const sum = cent.map(() => [0, 0, 0, 0]);
      for (const i of idx) { let bi = 0, bd = 1e9; for (let k = 0; k < K; k++) { const dl = L[i] - cent[k][0], da = a[i] - cent[k][1], db = b[i] - cent[k][2]; const d = dl * dl + da * da + db * db; if (d < bd) { bd = d; bi = k; } } const s0 = sum[bi]; s0[0] += L[i]; s0[1] += a[i]; s0[2] += b[i]; s0[3]++; }

  },
  ref(P, x, y, r) {

  return zxingPromise;
}
A.decodeBarcode = async (img) => {
  if ('BarcodeDetector' in window) {
    try { const det = new window.BarcodeDetector({ formats: ['ean_13', 'ean_8', 'upc_a', 'upc_e', 'code_128', 'code_39', 'qr_code'] }); const r = await det.detect(img); if (r && r[0] && r[0].rawValue) return r[0].rawValue; } catch (e) { /* fall back */ }
  }
  const Z = await loadZXing();
  const hints = new Map();
  hints.set(Z.DecodeHintType.TRY_HARDER, true);
  hints.set(Z.DecodeHintType.POSSIBLE_FORMATS, [Z.BarcodeFormat.EAN_13, Z.BarcodeFormat.EAN_8, Z.BarcodeFormat.UPC_A, Z.BarcodeFormat.UPC_E, Z.BarcodeFormat.CODE_128, Z.BarcodeFormat.CODE_39, Z.BarcodeFormat.QR_CODE]);
  const reader = new Z.MultiFormatReader(); reader.setHints(hints);
  const tries = [1400, 900, 2000];
  for (const max of tries) {
    for (const rot of [0, 90]) {
      const base = A.scaled(img, max, max); let c = base;
      if (rot) { c = document.createElement('canvas'); c.width = base.height; c.height = base.width; const g = c.getContext('2d'); g.translate(c.width / 2, c.height / 2); g.rotate(Math.PI / 2); g.drawImage(base, -base.width / 2, -base.height / 2); }
      try { const src = new Z.HTMLCanvasElementLuminanceSource(c); const bmp = new Z.BinaryBitmap(new Z.HybridBinarizer(src)); const res = reader.decode(bmp); if (res) return res.getText(); } catch (e) { /* try next */ }
    }
  }
  return null;
};

/* ---------------- backup ---------------- */
const blobToDataUrl = (b) => new Promise((res) => { const r = new FileReader(); r.onload = () => res(r.result); r.readAsDataURL(b); });
const dataUrlToBlob = (u) => { const i = u.indexOf(','); const head = u.slice(0, i); const mime = (head.match(/data:([^;,]+)/) || [])[1] || 'application/octet-stream'; const bin = atob(u.slice(i + 1)); const arr = new Uint8Array(bin.length); for (let k = 0; k < bin.length; k++) arr[k] = bin.charCodeAt(k); return new Blob([arr], { type: mime }); };
A.exportAll = async () => {
  const items = await A.Store.all('items'), outfits = await A.Store.all('outfits'), meta = await A.Store.all('meta'), blobs = await A.Store.all('blobs');
  const b = {}; for (const r of blobs) b[r.id] = await blobToDataUrl(r.blob);
  return JSON.stringify({ app: 'aski', v: 1, at: new Date().toISOString(), items, outfits, meta, blobs: b });
};
A.importAll = async (text) => {
  const d = JSON.parse(text); if (!d || d.app !== 'aski') throw new Error('Bu dosya bir Askı yedeği değil.');
  for (const s of STORES) await A.Store.clear(s);
  for (const [id, u] of Object.entries(d.blobs || {})) await A.Store.put('blobs', { id, blob: dataUrlToBlob(u) });
  for (const it of d.items || []) await A.Store.put('items', it);
  for (const o of d.outfits || []) await A.Store.put('outfits', o);
  for (const m of d.meta || []) await A.Store.put('meta', m);
  urls.forEach((u) => URL.revokeObjectURL(u)); urls.clear();
};

/* ---------------- downloads / sharing ---------------- */
A.saveFile = async (filename, blob) => {
  try {
    if (window.claude && typeof window.claude.use === 'function') {
      const dl = await window.claude.use('downloads');
      if (dl) { await dl.save({ filename, data: blob }); return 'saved'; }
    }
  } catch (e) { if (e && e.code === 'cancelled') return 'cancelled'; }
  try {
    const file = new File([blob], filename, { type: blob.type });
    if (navigator.canShare && navigator.canShare({ files: [file] }) && /\.(png|jpe?g)$/i.test(filename)) { await navigator.share({ files: [file], title: 'Askı' }); return 'shared'; }
  } catch (e) { if (e && e.name === 'AbortError') return 'cancelled'; }
  try { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000); return 'downloaded'; } catch (e) { return 'failed'; }
};
A.canShareText = () => !!navigator.share && !(window.claude && typeof window.claude.use === 'function');
})();

/* ---------------- person photo & look rendering ---------------- */
const personCache = {};
function calibrated(a) { const r = S.person[a]; return !!(r && r.photoId && (r.maskTopId || r.maskBottomId)); }
async function getPerson(angle) {
  const r = S.person[angle]; if (!r || !r.photoId) return null;
  const key = r.photoId + ':' + (r.v || 0);
  if (personCache[angle] && personCache[angle].key === key) return personCache[angle];
  const url = await A.loadUrl(r.photoId); if (!url) return null;
  const img = await A.urlToImage(url);
  const c = document.createElement('canvas'); c.width = r.w; c.height = r.h;
  const g = c.getContext('2d', { willReadFrequently: true }); g.drawImage(img, 0, 0, r.w, r.h);
  const imgData = g.getImageData(0, 0, r.w, r.h);
  let top = null, bottom = null;
  if (r.maskTopId) { const b = await A.getBlob(r.maskTopId); if (b) top = await A.blobToMask(b, r.w, r.h); }
  if (r.maskBottomId) { const b = await A.getBlob(r.maskBottomId); if (b) bottom = await A.blobToMask(b, r.w, r.h); }
  const st = { key, imgData, w: r.w, h: r.h, prepTop: top ? A.Recolor.prepare(imgData, top) : null, prepBottom: bottom ? A.Recolor.prepare(imgData, bottom) : null };
  personCache[angle] = st; return st;
}
function renderLook(st, slots, orig) {
  const out = new ImageData(new Uint8ClampedArray(st.imgData.data), st.w, st.h);
  if (!orig) {
    const t = byId(slots.ust), b = byId(slots.alt);
    if (t && st.prepTop && st.prepTop.n) A.Recolor.apply(out.data, st.imgData.data, st.prepTop, t.color.hex);
    if (b && st.prepBottom && st.prepBottom.n) A.Recolor.apply(out.data, st.imgData.data, st.prepBottom, b.color.hex);
  }
  return out;
}
let stageToken = 0;
async function drawStage() {
  const cv = $('#stage-canvas'); if (!cv) return;
  const my = ++stageToken; const st = await getPerson(S.kabin.angle);
  if (!st || my !== stageToken || !document.body.contains(cv)) return;
  cv.width = st.w; cv.height = st.h; cv.getContext('2d').putImageData(renderLook(st, S.kabin.slots, S.kabin.orig), 0, 0);
}
function lookAlt() { const parts = A.SLOT_ORDER.map((s) => byId(S.kabin.slots[s])).filter(Boolean).map((i) => lower(i.name)); return 'Senin fotoğrafın' + (parts.length ? ': ' + parts.join(', ') : ''); }
async function lookImage(slots, w = 360) {
  if (calibrated('front')) {
    const st = await getPerson('front');
    if (st) { const c = document.createElement('canvas'); c.width = st.w; c.height = st.h; c.getContext('2d').putImageData(renderLook(st, slots, false), 0, 0); const h = Math.round((w * 4) / 3); const o = document.createElement('canvas'); o.width = w; o.height = h; const g = o.getContext('2d'); g.fillStyle = S.person.front.bg || '#ECEBE9'; g.fillRect(0, 0, w, h); const s = Math.min(w / st.w, h / st.h); g.imageSmoothingQuality = 'high'; g.drawImage(c, (w - st.w * s) / 2, (h - st.h * s) / 2, st.w * s, st.h * s); return o; }
  }
  return collage(slots, w);
}
async function collage(slots, w = 360) {
  const h = Math.round((w * 4) / 3); const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d'); g.fillStyle = '#ECEBE9'; g.fillRect(0, 0, w, h);
  const spots = { dis: [0.04, 0.05, 0.44, 0.38], ust: [0.3, 0.04, 0.66, 0.42], alt: [0.22, 0.42, 0.56, 0.5], ayakkabi: [0.04, 0.72, 0.36, 0.24], aksesuar: [0.72, 0.62, 0.24, 0.24] };
  for (const s of ['dis', 'alt', 'ust', 'ayakkabi', 'aksesuar']) {
    const it = byId(slots[s]); if (!it) continue; const u = A.urlOf(it.thumbId) || (await A.loadUrl(it.thumbId)); if (!u) continue;
    try { const img = await A.urlToImage(u); const [x, y, bw, bh] = spots[s]; const X = x * w, Y = y * h, W = bw * w, H = bh * h; const sc = it.fit === 'cover' ? Math.max(W / img.width, H / img.height) * 0.98 : Math.min(W / img.width, H / img.height); const dw = img.width * sc, dh = img.height * sc; g.save(); if (it.fit === 'cover') { g.beginPath(); g.roundRect ? g.roundRect(X, Y, W, H, 14) : g.rect(X, Y, W, H); g.clip(); } g.drawImage(img, X + (W - dw) / 2, Y + (H - dh) / 2, dw, dh); g.restore(); } catch (e) { /* skip */ }
  }
  return c;
}

OV.cal = {
  render: (ov) => {

    const reg = ov.active; const tol = (c[reg].tol || 14);
    return `<div class="ov-head">${back('calClose', 'Kapat')}<span class="title">Kıyafetlerini işaretle</span><button class="btn btn-ghost btn-xs" data-act="calReset">Sıfırla</button></div>
      <p class="small" style="font-weight:600;min-height:38px" id="cal-hint">${hint}</p>
      <div class="cal-stage" id="cal-stage"><canvas id="cal-canvas" aria-label="Fotoğrafın; dokunarak kıyafetlerini işaretle"></canvas><div class="waist" id="cal-waist" style="top:${(c.waist / ov.h) * 100}%"><button class="handle-btn" id="cal-waist-h" aria-label="Bel çizgisini kaydır">${I('sliders', 14)} BEL</button></div></div>
      <div class="row between" style="margin-top:10px"><div class="legend"><span><i style="background:var(--top)"></i>Üst</span><span><i style="background:var(--bottom)"></i>Alt</span></div><span class="tiny muted">Bel çizgisi üstü altından ayırır</span></div>
      <div class="grid2" style="margin-top:12px"><div class="seg" role="group" aria-label="Bölge"><button class="${reg === 'top' ? 'on' : ''}" data-act="calRegion" data-v="top">Üst</button><button class="${reg === 'bottom' ? 'on' : ''}" data-act="calRegion" data-v="bottom">Alt</button></div>
      <div class="seg" role="group" aria-label="Araç"><button class="${ov.tool === 'tap' ? 'on' : ''}" data-act="calTool" data-v="tap" aria-label="Dokun">${I('tap', 18)}</button><button class="${ov.tool === 'add' ? 'on' : ''}" data-act="calTool" data-v="add" aria-label="Fırça">${I('brush', 18)}</button><button class="${ov.tool === 'erase' ? 'on' : ''}" data-act="calTool" data-v="erase" aria-label="Silgi">${I('eraser', 18)}</button></div></div>
      <label class="field" style="margin-top:12px"><span class="row between"><span class="mono muted">HASSASİYET · ${reg === 'top' ? 'ÜST' : 'ALT'}</span><span class="tiny muted">Taşıyorsa azalt, eksikse artır</span></span><input class="range" type="range" min="6" max="30" step="1" value="${tol}" id="cal-tol"></label>
      <div class="ov-foot"><button class="btn btn-primary btn-block" data-act="calSave" ${ov.P && (nt || nb) ? '' : 'disabled'}>${I('check', 18)} Kaydet</button></div>`;
  },
  mount: (ov, el) => {
    const cv = $('#cal-canvas', el); cv.width = ov.w; cv.height = ov.h;
    ov.cv = cv; calDraw(ov);
    if (!ov.P) setTimeout(() => { ov.P = A.Seg.prepare(ov.base); if (ov.cal.top.seeds.length || ov.cal.bottom.seeds.length) ov.masks = A.Seg.masks(ov.P, ov.cal); renderOv(); }, 30);
    let stroke = null, downAt = null;
    const pt = (ev) => { const r = cv.getBoundingClientRect(); return { x: ((ev.clientX - r.left) / r.width) * ov.w, y: ((ev.clientY - r.top) / r.height) * ov.h }; };
    cv.addEventListener('pointerdown', (ev) => {
      if (!ov.P) return; ev.preventDefault(); cv.setPointerCapture(ev.pointerId); const p = pt(ev); downAt = p;
      if (ov.tool !== 'tap') { stroke = { mode: ov.tool === 'add' ? 'add' : 'erase', r: Math.round(ov.w * 0.03), pts: [p] }; paintLive(ov, stroke); }
    });
    cv.addEventListener('pointermove', (ev) => { if (!stroke) return; stroke.pts.push(pt(ev)); paintLive(ov, stroke); });
    cv.addEventListener('pointerup', (ev) => {
      if (!ov.P) return; const p = pt(ev);
      if (stroke) { ov.cal[ov.active].strokes.push(stroke); stroke = null; ov.masks = A.Seg.masks(ov.P, ov.cal); calDraw(ov); return; }
      if (downAt && Math.hypot(p.x - downAt.x, p.y - downAt.y) < ov.w * 0.04) calTap(ov, p);
      downAt = null;
    });
    const h = $('#cal-waist-h', el); const line = $('#cal-waist', el);
    h.addEventListener('pointerdown', (ev) => { ev.preventDefault(); ev.stopPropagation(); h.setPointerCapture(ev.pointerId); h._drag = true; });
    h.addEventListener('pointermove', (ev) => { if (!h._drag) return; const r = cv.getBoundingClientRect(); const y = clamp(((ev.clientY - r.top) / r.height) * ov.h, ov.h * 0.15, ov.h * 0.85); ov.cal.waist = y; ov.waistSet = true; line.style.top = (y / ov.h) * 100 + '%'; });
    h.addEventListener('pointerup', () => { if (!h._drag) return; h._drag = false; if (ov.P) { ov.masks = A.Seg.masks(ov.P, ov.cal); calDraw(ov); } });
    $('#cal-tol', el).addEventListener('change', (ev) => { ov.cal[ov.active].tol = +ev.target.value; if (ov.P) { ov.masks = A.Seg.masks(ov.P, ov.cal); calDraw(ov); } });
  },
};
function calTap(ov, p) {
  const reg = ov.active; ov.cal[reg].seeds.push({ x: Math.round(p.x), y: Math.round(p.y) });
  if (reg === 'top' && !ov.cal.bottom.seeds.length) { ov.active = 'bottom'; }
  if (!ov.waistSet && ov.cal.top.seeds.length && ov.cal.bottom.seeds.length) ov.cal.waist = autoWaist(ov.P, ov.cal);
  else if (!ov.waistSet && reg === 'top' && !ov.cal.bottom.seeds.length) ov.cal.waist = Math.min(ov.h * 0.62, p.y + ov.h * 0.2);
  ov.masks = A.Seg.masks(ov.P, ov.cal); renderOv();
}
function autoWaist(P, cal) {
  const t = cal.top.seeds[0], b = cal.bottom.seeds[0];
  if (b.y <= t.y + 10) return (t.y + b.y) / 2;
  const rt = A.Seg.ref(P, Math.round(t.x), Math.round(t.y), 3), rb = A.Seg.ref(P, Math.round(b.x), Math.round(b.y), 3);
  let y = t.y + (b.y - t.y) * 0.45;
  if (A.dE(rt, rb) > 14) {
    const m = A.Seg.grow(P, cal.top.seeds, cal.top.tol || 14, 0, Math.round(b.y) - 2, null);
    const rows = new Int32Array(P.h); let mx = 0;
    for (let yy = 0; yy < P.h; yy++) { let c = 0; for (let x = 0; x < P.w; x++) c += m[yy * P.w + x]; rows[yy] = c; if (c > mx) mx = c; }
    let hem = Math.round(t.y); for (let yy = Math.round(t.y); yy < b.y; yy++) if (rows[yy] > mx * 0.22) hem = yy;
    y = hem + 3;
  }
  return clamp(y, t.y + 6, b.y - 6);
}
function calDraw(ov) {
  const cv = ov.cv; if (!cv || !document.body.contains(cv)) return;
  const g = cv.getContext('2d');
  if (!ov.baseCanvas) { ov.baseCanvas = document.createElement('canvas'); ov.baseCanvas.width = ov.w; ov.baseCanvas.height = ov.h; ov.baseCanvas.getContext('2d').putImageData(ov.base, 0, 0); }
  g.drawImage(ov.baseCanvas, 0, 0);
  if (ov.masks) {
    if (!ov.ovl) { ov.ovl = document.createElement('canvas'); ov.ovl.width = ov.w; ov.ovl.height = ov.h; ov.ovlData = ov.ovl.getContext('2d').createImageData(ov.w, ov.h); }
    const d = ov.ovlData.data; const t = ov.masks.top.bin, b = ov.masks.bottom.bin;
    for (let i = 0, p = 0; i < t.length; i++, p += 4) {
      if (t[i]) { d[p] = 255; d[p + 1] = 212; d[p + 2] = 58; d[p + 3] = 150; } else if (b[i]) { d[p] = 61; d[p + 1] = 123; d[p + 2] = 255; d[p + 3] = 130; } else d[p + 3] = 0;
    }
    ov.ovl.getContext('2d').putImageData(ov.ovlData, 0, 0); g.drawImage(ov.ovl, 0, 0);
  }
  const r = Math.max(6, ov.w * 0.014);
  for (const [reg, col] of [['top', '#FFD43A'], ['bottom', '#3D7BFF']]) for (const s of ov.cal[reg].seeds) { g.beginPath(); g.arc(s.x, s.y, r, 0, Math.PI * 2); g.fillStyle = col; g.fill(); g.lineWidth = r * 0.45; g.strokeStyle = '#15171B'; g.stroke(); }
}
let paintRaf = 0;
function paintLive(ov, stroke) {
  if (!ov.masks) ov.masks = A.Seg.masks(ov.P, ov.cal);
  const reg = ov.masks[ov.active]; const waist = Math.round(ov.cal.waist);
  const [y0, y1] = ov.active === 'top' ? [0, waist] : [waist, ov.h - 1];
  A.Seg.stroke(reg.bin, ov.w, ov.h, { mode: stroke.mode, r: stroke.r, pts: stroke.pts.slice(-2) }, y0, y1);
  if (!paintRaf) paintRaf = requestAnimationFrame(() => { paintRaf = 0; calDraw(ov); });
}

function boxEl(b, o) {
  const below = b.y < 0.08;
  return `<div class="box ${o.sel ? 'sel' : ''}" data-box="${b.id}" style="left:${b.x * 100}%;top:${b.y * 100}%;width:${b.w * 100}%;height:${b.h * 100}%">${o.label ? `<span class="lbl ${below ? 'below' : ''}">${esc(o.label)}</span>` : ''}${o.rm ? `<button class="rm" data-act="boxRemove" data-id="${b.id}" aria-label="Kutuyu sil">${I('x', 14, 2.4)}</button>` : ''}<span class="rs" data-handle="rs"></span></div>`;
}
function mountBox(el, opt) {
  let drag = null;
  const rel = (ev) => { const r = el.getBoundingClientRect(); return { x: clamp((ev.clientX - r.left) / r.width, 0, 1), y: clamp((ev.clientY - r.top) / r.height, 0, 1) }; };
  const find = (id) => opt.boxes.find((b) => b.id === id);
  const place = (b) => { const n = el.querySelector(`[data-box="${b.id}"]`); if (n) { n.style.left = b.x * 100 + '%'; n.style.top = b.y * 100 + '%'; n.style.width = b.w * 100 + '%'; n.style.height = b.h * 100 + '%'; } };
  el.addEventListener('pointerdown', (ev) => {
    if (ev.target.closest('.rm')) return;
    const p = rel(ev); const bx = ev.target.closest('.box');
    if (bx) { const b = find(bx.dataset.box); if (!b) return; drag = { mode: ev.target.dataset.handle === 'rs' ? 'rs' : 'mv', b, p, o: Object.assign({}, b) }; }
    else if (opt.multi) { const b = { id: uid('bx'), x: p.x, y: p.y, w: 0.001, h: 0.001 }; opt.boxes.push(b); el.insertAdjacentHTML('beforeend', boxEl(b, { label: 'PARÇA', rm: true })); drag = { mode: 'new', b, p, o: Object.assign({}, b) }; }
    else return;
    ev.preventDefault(); el.setPointerCapture(ev.pointerId);
    if (opt.onSelect) opt.onSelect(drag.b.id);
  });
  el.addEventListener('pointermove', (ev) => {
    if (!drag) return; const p = rel(ev); const { b, o } = drag; const dx = p.x - drag.p.x, dy = p.y - drag.p.y;
    if (drag.mode === 'mv') { b.x = clamp(o.x + dx, 0, 1 - o.w); b.y = clamp(o.y + dy, 0, 1 - o.h); }
    else if (drag.mode === 'rs') { b.w = clamp(o.w + dx, 0.05, 1 - o.x); b.h = clamp(o.h + dy, 0.05, 1 - o.y); }
    else { b.x = Math.min(drag.p.x, p.x); b.y = Math.min(drag.p.y, p.y); b.w = Math.abs(dx); b.h = Math.abs(dy); }
    place(b);
  });
  const end = () => {
    if (!drag) return; const { b, mode } = drag; drag = null;
    if (mode === 'new' && (b.w < 0.04 || b.h < 0.03)) { opt.boxes.splice(opt.boxes.indexOf(b), 1); const n = el.querySelector(`[data-box="${b.id}"]`); if (n) n.remove(); return; }
    if (opt.onEnd) opt.onEnd(b, mode === 'new');
  };
  el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end);
}

  wore: async () => { const o = S.outfits.find((x) => x.id === S.kabin.outfitId); const n = await markWorn(S.kabin.slots, o); render(); toast(n ? `Bugün giydiğin ${n} parça işlendi; öneriler buna göre değişir.` : 'Bugün için zaten işlendi.'); },
  woreOutfit: async (el) => { const o = S.outfits.find((x) => x.id === el.dataset.id); if (!o) return; const n = await markWorn(o.slots, o); closeSheet(); render(); toast(n ? 'Bugün giydin olarak işlendi.' : 'Bugün için zaten işlendi.'); },
  loadOutfit: (el) => { const o = S.outfits.find((x) => x.id === el.dataset.id); if (!o) return; S.kabin.slots = Object.assign({}, o.slots); S.kabin.title = o.name; S.kabin.eyebrow = 'KOMBİNİM · ' + (A.OCC[o.occasion] || '').toLocaleUpperCase('tr-TR'); S.kabin.outfitId = o.id; S.kabin.occasion = o.occasion; saveKabin(); closeSheet(); S.route = 'kabin'; render(); },
  shareOutfit: (el) => { const o = S.outfits.find((x) => x.id === el.dataset.id); if (o) shareOutfit(o); },
  deleteOutfit: async (el) => { const o = S.outfits.find((x) => x.id === el.dataset.id); if (!o || !(await confirmBox(`“${o.name}” kombini silinsin mi? Parçalar dolabında kalır.`))) return; await A.delBlob(o.thumbId); await A.Store.del('outfits', o.id); S.outfits = S.outfits.filter((x) => x.id !== o.id); if (S.kabin.outfitId === o.id) S.kabin.outfitId = null; closeSheet(); render(); toast('Kombin silindi.'); },
  sugOcc: (el) => { const ov = S.ov; ov.occ = el.dataset.v; ov.seen = []; ov.aiMsg = null; runSuggest(ov); },
  sugMore: () => { S.sugSeed++; S.ov.aiMsg = null; runSuggest(S.ov); },
  sugOpen: (el) => { const s = S.ov.list[+el.dataset.i]; if (!s) return; S.kabin.slots = Object.assign({}, s.slots); S.kabin.title = s.title; S.kabin.eyebrow = (s.source === 'ai' ? 'CLAUDE ÖNERİSİ · ' : 'ÖNERİ · ') + A.OCC[S.ov.occ].toLocaleUpperCase('tr-TR'); S.kabin.outfitId = null; S.kabin.occasion = S.ov.occ; saveKabin(); closeOv(); S.route = 'kabin'; render(); },
  sugSave: async (el) => { const s = S.ov.list[+el.dataset.i]; if (!s) return; el.disabled = true; await createOutfit(s.slots, s.title, S.ov.occ); toast('Kombinlerine kaydedildi.'); },
  sugAI: async () => {
    const ov = S.ov; ov.aiBusy = true; ov.aiMsg = null; renderOv();
    try {
      const r = await A.AI.outfits(S.items, ov.occ, A.currentSeason());
      const ok = (id, cat) => { const it = byId(id); return it && it.status === 'dolap' && it.cat === cat ? id : null; };
      const list = (r && Array.isArray(r.oneriler) ? r.oneriler : []).map((x) => ({ slots: { ust: ok(x.ust, 'ust'), alt: ok(x.alt, 'alt'), dis: ok(x.dis, 'dis'), ayakkabi: ok(x.ayakkabi, 'ayakkabi'), aksesuar: ok(x.aksesuar, 'aksesuar') }, title: String(x.baslik || 'Claude önerisi').slice(0, 40), reason: String(x.neden || '').slice(0, 220), source: 'ai' })).filter((x) => x.slots.ust && x.slots.alt);
      ov.aiBusy = false; if (list.length) { ov.list = list; ov.aiMsg = null; } else ov.aiMsg = 'Claude geçerli bir kombin döndürmedi; kurallı öneriler duruyor.';
      renderOv(); previews(ov);
    } catch (e) { ov.aiBusy = false; ov.aiMsg = A.AI.errorText(e) || null; renderOv(); }
  },
  aiRecognize: async () => {
    const ov = S.ov; const img = ov.img || ov.tagImg; if (!img) return; ov.aiBusy = true; renderOv();
    try {
      const crop = A.scaled(img, 1100, 1100, A.boxToPixels(img, ov.box || defaultBox(img))); const blob = await A.toBlob(crop, 'image/jpeg', 0.88);
      const r = await A.AI.recognize(blob); const f = ov.form;
      if (r && A.CAT[r.kategori]) { f.cat = r.kategori; f.type = A.CAT[f.cat].types.find((t) => lower(t) === lower(r.tur || '')) || A.CAT[f.cat].types[0]; }
      if (r && /^#[0-9a-f]{6}$/i.test(r.renkHex || '')) { f.colorHex = r.renkHex.toUpperCase(); f.colorName = A.colorName(f.colorHex); f.colorManual = true; }
      if (r && r.isim) { f.name = String(r.isim).slice(0, 48); f.nameEdited = true; }
      if (r && r.marka && !f.brand) f.brand = String(r.marka).slice(0, 30);
      if (r && Array.isArray(r.mevsimler)) { const v = r.mevsimler.filter((x) => A.SEA[x]); if (v.length) f.seasons = v; }
      if (r && Array.isArray(r.ortamlar)) { const v = r.ortamlar.filter((x) => A.OCC[x]); if (v.length) f.occasions = v; }
      ov.aiBusy = false; ov.aiMsg = 'Claude doldurdu; istersen düzelt.'; renderOv();
    } catch (e) { ov.aiBusy = false; ov.aiMsg = A.AI.errorText(e) || null; renderOv(); }
  },
  aiTag: async () => {
    const ov = S.ov; if (!ov.tagImg) return; ov.aiBusy = true; renderOv();
    try {
      const blob = await A.toBlob(A.scaled(ov.tagImg, 1400, 1400), 'image/jpeg', 0.9); const r = await A.AI.tag(blob); const f = ov.form;
      if (r) { if (r.marka) f.brand = String(r.marka).slice(0, 30); if (r.beden) f.size = String(r.beden).slice(0, 12); if (r.fiyat) f.price = String(r.fiyat).slice(0, 16); if (r.barkod && !f.barcode) f.barcode = String(r.barkod); if (A.CAT[r.kategori]) { f.cat = r.kategori; f.type = A.CAT[f.cat].types.find((t) => lower(t) === lower(r.tur || '')) || A.CAT[f.cat].types[0]; } if (r.renkAdi) { const n = lower(String(r.renkAdi)); const p = A.PALETTE.find((x) => x[0] === n); if (p) { f.colorName = p[0]; f.colorHex = p[1]; f.colorManual = true; } } if (r.urunAdi) { f.name = String(r.urunAdi).slice(0, 48); f.nameEdited = true; } }
      ov.aiBusy = false; ov.aiMsg = 'Etiketten okunanlar dolduruldu.'; renderOv();
    } catch (e) { ov.aiBusy = false; ov.aiMsg = A.AI.errorText(e) || null; renderOv(); }
  },
  aiMirror: async () => {
    const ov = S.ov; ov.aiBusy = true; renderOv();
    try {
      const blob = await A.toBlob(A.scaled(ov.img, 1400, 1400), 'image/jpeg', 0.88); const r = await A.AI.mirror(blob);
      const parts = r && Array.isArray(r.parcalar) ? r.parcalar : [];
      const boxes = [];
      for (const p of parts.slice(0, 6)) {
        if (!Array.isArray(p.kutu) || p.kutu.length !== 4) continue; let [x0, y0, x1, y1] = p.kutu.map(Number); if ([x0, y0, x1, y1].some((v) => !isFinite(v))) continue;
        const pad = 0.015; const b = { id: uid('bx'), x: clamp(Math.min(x0, x1) / 1000 - pad, 0, 1), y: clamp(Math.min(y0, y1) / 1000 - pad, 0, 1) }; b.w = clamp(Math.abs(x1 - x0) / 1000 + pad * 2, 0.04, 1 - b.x); b.h = clamp(Math.abs(y1 - y0) / 1000 + pad * 2, 0.04, 1 - b.y);
        b.cat = A.CAT[p.kategori] ? p.kategori : guessCat(b); b.type = A.CAT[b.cat].types.find((t) => lower(t) === lower(p.tur || '')) || A.CAT[b.cat].types[0];
        if (/^#[0-9a-f]{6}$/i.test(p.renkHex || '')) { b.colorHex = p.renkHex.toUpperCase(); b.colorName = A.colorName(b.colorHex); b.aiColor = true; }
        if (p.isim) { b.name = String(p.isim).slice(0, 48); b.nameEdited = true; }
        await initMirrorBox(ov, b); boxes.push(b);
      }
      ov.aiBusy = false;
      if (boxes.length) { ov.boxes = boxes; ov.aiMsg = `${boxes.length} parça bulundu. Kutuları düzeltip eklemek istediklerini işaretle.`; } else ov.aiMsg = 'Claude parça bulamadı; kutuları elle çizebilirsin.';
      renderOv();
    } catch (e) { ov.aiBusy = false; ov.aiMsg = A.AI.errorText(e) || null; renderOv(); }
  },
  boxRemove: (el) => { const ov = S.ov; ov.boxes = ov.boxes.filter((b) => b.id !== el.dataset.id); renderOv(); },
  boxCat: async (el) => { const ov = S.ov; const b = ov.boxes.find((x) => x.id === el.dataset.id); if (!b) return; b.cat = el.dataset.v; b.type = A.CAT[b.cat].types[0]; if (!b.nameEdited) b.name = `${cap(b.colorName)} ${lower(b.type)}`; await refreshMirrorBox(ov, b); renderOv(); },
  boxCheck: (el) => { const b = S.ov.boxes.find((x) => x.id === el.dataset.id); if (b) { b.checked = !b.checked; renderOv(); } },
  saveMirror: async (el) => {
    const ov = S.ov; const sel = ov.boxes.filter((b) => b.checked); if (!sel.length) return; el.disabled = true;
    for (const b of sel) { const ids = await cropToItemImages(ov.img, b, 'cover'); const d = A.typeDefaults(b.type); const it = { id: uid('it'), status: 'dolap', cat: b.cat, type: b.type, name: b.name || `${cap(b.colorName)} ${lower(b.type)}`, color: { hex: b.colorHex, name: b.colorName }, brand: '', size: '', seasons: d.sea.slice(), occasions: d.occ.slice(), photoId: ids.photoId, thumbId: ids.thumbId, fit: 'cover', createdAt: Date.now(), wornCount: 0, lastWorn: null, source: 'Aynada tara' }; await A.Store.put('items', it); S.items.push(it); }
    closeOv(); S.route = 'dolap'; S.filters.dolap = 'all'; render(); toast(`${sel.length} parça dolabına eklendi.`);
  },
  fbRate: (el) => { S.ov.f.rate = +el.dataset.v; ls.set('fb', S.ov.f); renderOv(); },
  fbUsed: (el) => { const f = S.ov.f; const v = el.dataset.v; f.used = f.used.includes(v) ? f.used.filter((x) => x !== v) : f.used.concat(v); ls.set('fb', f); renderOv(); },
  fbCopy: async () => { const t = feedbackText(S.ov.f); try { await navigator.clipboard.writeText(t); toast('Metin kopyalandı. Şimdi uygulamayı sana gönderen kişiye yapıştır.'); } catch (e) { const pre = $('#fb-text'); if (pre) { const r = document.createRange(); r.selectNodeContents(pre); const s = window.getSelection(); s.removeAllRanges(); s.addRange(r); } toast('Metni seçtim; kopyala deyip gönderebilirsin.'); } },
  fbShare: async () => { try { await navigator.share({ title: 'Askı görüşüm', text: feedbackText(S.ov.f) }); } catch (e) { /* cancelled */ } },
  exportData: async () => { toast('Yedek hazırlanıyor…'); try { const json = await A.exportAll(); const r = await A.saveFile(`aski-yedek-${new Date().toISOString().slice(0, 10)}.json`, new Blob([json], { type: 'application/json' })); if (r === 'failed') toast('Bu görünümde dosya kaydedilemiyor.'); else if (r !== 'cancelled') toast('Yedek kaydedildi.'); } catch (e) { toast('Yedek alınamadı.'); } },
  loadDemo: () => { closeSheet(); loadDemo(); },
  removeDemo: () => removeDemo(),
};

/* ---------------- inputs ---------------- */
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const fn = ACT[el.dataset.act]; if (!fn) return; e.preventDefault();
  Promise.resolve(fn(el, e)).catch((err) => { console.error(err); toast('Bir şey ters gitti. Tekrar dene.'); });
});
document.addEventListener('change', async (e) => {
  const t = e.target; if (!(t instanceof HTMLInputElement) || t.type !== 'file' || !t.dataset.file) return;
  const file = t.files && t.files[0]; const key = t.dataset.file; t.value = ''; if (!file) return;
  const [kind, arg, extra] = key.split(':');
  try {
    if (kind === 'person') { toast('Fotoğraf hazırlanıyor…', 1500); closeSheet(); await processPersonPhoto(file, arg); if (extra === 'onb') closeOv(); await openCal(arg, extra === 'onb' ? 'onb' : null); }
    else if (kind === 'add') await onAddPhoto(file);
    else if (kind === 'tag') await onTagPhoto(file);
    else if (kind === 'mirror') { const img = await A.fileToImage(file); Object.assign(S.ov, { img, imgUrl: img.src, boxes: [], sel: null, aiMsg: null }); renderOv(); }
    else if (kind === 'import') { if (!(await confirmBox('Bu cihazdaki dolap, kombinler ve fotoğraflar yedekteki verilerle değiştirilsin mi?', 'Geri yükle', false))) return; await A.importAll(await file.text()); await loadAll(); render(); toast('Yedek geri yüklendi.'); }
  } catch (err) { console.error(err); toast(err && err.message && err.message.length < 80 ? err.message : 'Dosya işlenemedi.'); }
});
document.addEventListener('input', (e) => {
  const t = e.target; const ov = S.ov;
  if (t.dataset.field && ov && ov.form) { const k = t.dataset.field; ov.form[k] = t.value; if (k === 'name') ov.form.nameEdited = true; }
  else if (t.dataset.bfield && ov && ov.boxes) { const b = ov.boxes.find((x) => x.id === t.dataset.id); if (b) { b.name = t.value; b.nameEdited = true; } }
  else if (t.dataset.ffield && ov && ov.f) { ov.f[t.dataset.ffield] = t.value; ls.set('fb', ov.f); const pre = $('#fb-text'); if (pre) pre.textContent = feedbackText(ov.f); }
  else if (t.dataset.sfield && S.sheet) S.sheet[t.dataset.sfield] = t.value;
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { if ($('#dialog-root').innerHTML) return; if (S.sheet) closeSheet(); else if (S.ov && S.ov.kind !== 'onboard') closeOv(); } });

/* ---------------- boot ---------------- */
async function loadAll() {
  S.items = await A.Store.all('items'); S.outfits = await A.Store.all('outfits');
  S.person = await A.meta('person', {}); S.kabin = Object.assign(defaultKabin(), await A.meta('kabin', {}));
  S.onboarded = await A.meta('onboarded', false);
  const ids = []; S.items.forEach((i) => ids.push(i.thumbId, i.photoId)); S.outfits.forEach((o) => ids.push(o.thumbId)); Object.values(S.person).forEach((p) => p && ids.push(p.thumbId, p.photoId));
  await Promise.all(ids.filter(Boolean).map((id) => A.loadUrl(id)));
  for (const s of A.SLOT_ORDER) if (S.kabin.slots[s] && !byId(S.kabin.slots[s])) S.kabin.slots[s] = null;
  if (!A.SLOT_ORDER.some((s) => S.kabin.slots[s])) fillToday();
}
async function boot() {
  await A.Store.init();
  await loadAll();
  S.route = ls.get('route', 'kabin'); if (!SCREENS[S.route]) S.route = 'kabin';
  render();
  if (!S.onboarded) openOv('onboard', { step: 1 });
  A.AI.init().then(() => { if (A.AI.on) { if (S.ov) renderOv(); } });
  window.__aski = { S, A, render };
}
boot().catch((e) => { console.error(e); const s = document.getElementById('screen'); if (s) s.innerHTML = '<div class="screen"><p class="h3">Askı açılamadı.</p><p class="small muted">Sayfayı yenilemeyi dene.</p></div>'; });
})();
</script>
